name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  NODE_VERSION: 22.18.0

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test ! -f dist/.env

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The import graph is only proven by booting it. No database is available
      # in CI; the connection fails fast and the health route must still answer.
      - name: Verify server boots
        env:
          PORT: 3999
          JWT_SECRET: ci-only
          MONGODB_URI: mongodb://127.0.0.1:1/pacepilot?serverSelectionTimeoutMS=500
        run: |
          node --import ./scripts/register-alias.mjs src/index.ts &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3999/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3999/api/health

      - name: Verify workflow tasks register
        env:
          JWT_SECRET: ci-only
          MONGODB_URI: mongodb://127.0.0.1:1/pacepilot?serverSelectionTimeoutMS=500
          RENDER_SDK_AUTO_START: "false"
        run: node --import ./scripts/register-alias.mjs --disable-warning=ExperimentalWarning workflows/main.ts

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Reject committed secrets
        run: |
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "ERROR: .env committed"
            exit 1
          fi
          if grep -rEo 'sk-(live|test)-[A-Za-z0-9]{10,}|xox[bap]-|AKIA[0-9A-Z]{16}' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist .; then
            echo "ERROR: suspected secret in tree"
            exit 1
          fi
          echo "Secret scan clean"

      - name: Verify deploy configuration
        run: test -f render.yaml

      - name: Audit dependencies (high and critical block)
        run: |
          npm audit --prefix server --audit-level=high
          npm audit --prefix client --audit-level=high

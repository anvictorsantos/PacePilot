name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Install / typecheck / build / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server deps (lockfile strict)
        working-directory: server
        run: npm ci

      - name: Install client deps (lockfile strict)
        working-directory: client
        run: npm ci

      # TS migration policy: strict for new code. tsc --noEmit must pass where a
      # tsconfig exists; no skipLibCheck hides. The server is TypeScript now but
      # still has no server/tsconfig.json, so nothing typechecks it — that debt
      # is reported here rather than hidden.
      - name: Typecheck (when tsconfig present)
        run: |
          if [ -f server/tsconfig.json ] || [ -f tsconfig.json ]; then
            echo "tsconfig found — typechecking server with tsc"
            npx -y -p typescript@5 tsc --noEmit -p server || npx -y -p typescript@5 tsc --noEmit
          else
            echo "No server tsconfig yet — server typecheck skipped, debt visible"
          fi
          if [ -f client/tsconfig.json ]; then
            echo "client tsconfig found — typechecking client with vue-tsc"
            npm --prefix client run typecheck
          fi

      # Lint and formatting were local-only gates: CI ran neither, and the
      # pre-commit hook only exists once `npm install` / `npm run prepare` has
      # run husky on a clone. Both checks are cheap.
      - name: Lint + format check (client)
        working-directory: client
        run: |
          npm run lint
          npm run format:check

      - name: Build client
        working-directory: client
        run: npm run build
      # The deploy path is the Netlify function bundle (netlify.toml: esbuild,
      # functions = server/functions). Bundle it here so a broken import graph
      # fails in CI rather than at deploy time. The old check ran `node --check`
      # on server/src/app.js and server/src/index.js — files that no longer
      # existed, so the step failed for the wrong reason.
      - name: Verify function adapter + app factory
        run: |
          node --check server/functions/api.mjs
          test -f server/src/app.ts || (echo "server/src/app.ts missing" && exit 1)
          test -f server/src/index.ts || (echo "server/src/index.ts missing" && exit 1)
          npx --yes esbuild server/functions/api.mjs --bundle --platform=node --format=esm \
            --outfile=/dev/null --external:express --external:mongoose --external:serverless-http
          test -f client/dist/index.html || (echo "client/dist/index.html missing after build" && exit 1)
          test -f netlify.toml || (echo "netlify.toml missing" && exit 1)

      - name: Secret hygiene (no .env / secrets in artifacts)
        run: |
          git ls-files | grep -E '(^|/)\.env$' && (echo "ERROR: .env committed" && exit 1) || true
          grep -rEo 'sk-(live|test)-[A-Za-z0-9]{10,}|xox[bap]-|AKIA[0-9A-Z]{16}' --exclude-dir=node_modules --exclude-dir=dist . && (echo "ERROR: suspected secret in tree" && exit 1) || echo "secret scan clean"
          test ! -f client/dist/.env && echo "dist clean"

      - name: Dependency audit (server blocks on high/critical)
        run: npm audit --prefix server --audit-level=high

      # KNOWN-DEBT: client vite5/postcss chain reports 10 high (source-map-js
      # GHSA-68fv-2mgg-jv7q et al). Fix = major vite/tailwind upgrade, tracked
      # separately. Report-only here so pipeline stays green; server stays blocking.
      - name: Dependency audit (client report-only, see deployment.md)
        continue-on-error: true
        run: npm audit --prefix client --audit-level=high

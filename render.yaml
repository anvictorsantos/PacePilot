# Render blueprint — ONE Node web service serving both /api and the built SPA.
#
# One origin is the whole point: the client calls `/api` relatively and the
# session ride on an httpOnly SameSite=Lax cookie, so a second Render service for
# the client would be cross-origin and both would break. Express is both the API
# and the static host.
# Deploy: Render → New → Blueprint → this repo. Spec: render.com/docs/blueprint-spec
services:
  - type: web
    name: pacepilot
    runtime: node
    plan: free
    branch: main
    # deploy.yml is the only production writer, after CI succeeds on main.
    autoDeployTrigger: off
    # region: frankfurt        # uncomment to pin; defaults to oregon
    # Node >= 22.18 — `npm start` executes src/*.ts via Node's type stripping.
    # NODE_ENV=production is injected by Render, which arms the env guards
    # (JWT_SECRET + TOKEN_ENCRYPTION_KEY are hard requirements there) and the
    # cookie's Secure flag. PORT is injected too.
    buildCommand: >-
      HUSKY=0 npm ci --prefix client --include=dev --no-audit --no-fund &&
      npm run build --prefix client &&
      npm ci --prefix server --include=dev --no-audit --no-fund &&
      npm run typecheck --prefix server
    # `--include=dev` matters: Render exports NODE_ENV=production at build time,
    # so a plain `npm ci` would skip vite and the client build would fail.
    # cwd must be server/ — the start script loads ./scripts/register-alias.mjs
    # and src/index.ts relative to it.
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # Atlas connection string. Render has no managed MongoDB.
      - key: MONGODB_URI
        sync: false
      # Both secrets are generated and stored by Render. Keep them stable:
      # rotating JWT_SECRET logs everyone out, rotating TOKEN_ENCRYPTION_KEY
      # makes stored Strava tokens undecryptable (users reconnect). Both must
      # match on every environment that shares this database.
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # CORS + CSRF allowlist. Set to https://<service>.onrender.com
      - key: CLIENT_URL
        sync: false
      # Optional: canonical host for browser redirects when it is not the first
      # entry in CLIENT_URL. Defaults to that first entry.
      # - key: APP_URL
      #   value: https://<service>.onrender.com
      - key: VITE_SENTRY_ENV
        value: production
      # VITE_SENTRY_RELEASE is written by the Release workflow before deploy.
      - key: WORKFLOW_SERVICE_SLUG
        value: pacepilot-workflows
      - key: RENDER_API_KEY
        sync: false
      - key: PROVIDERS_ENABLED
        value: strava
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      # Must equal https://<service>.onrender.com/api/providers/strava/callback
      # (or the legacy /api/strava/callback alias) and match the Strava app's
      # Authorization Callback Domain.
      - key: STRAVA_REDIRECT_URI
        sync: false
      # Optional — AI endpoints answer 503 without it, the deterministic plan is
      # unaffected. Model ids must end in ":free" or production startup refuses.
      # - key: OPENROUTER_API_KEY
      #   sync: false
      # Transactional email. pacepilot.pt is verified in Resend; keep the sender
      # on that domain or DKIM/SPF will not line up.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "PacePilot <no-reply@pacepilot.pt>"
      - key: EMAIL_ENABLED
        value: "true"

  # Durable Strava history import. Triggered by the web service after linking.
  - type: workflow
    name: pacepilot-workflows
    runtime: node
    branch: main
    autoDeployTrigger: off
    buildCommand: >-
      HUSKY=0 npm ci --prefix server --include=dev --no-audit --no-fund &&
      npm run typecheck --prefix server
    startCommand: cd server && npm run workflows:start
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: MONGODB_URI
        fromService:
          type: web
          name: pacepilot
          envVarKey: MONGODB_URI
      - key: JWT_SECRET
        fromService:
          type: web
          name: pacepilot
          envVarKey: JWT_SECRET
      - key: TOKEN_ENCRYPTION_KEY
        fromService:
          type: web
          name: pacepilot
          envVarKey: TOKEN_ENCRYPTION_KEY
      - key: PROVIDERS_ENABLED
        fromService:
          type: web
          name: pacepilot
          envVarKey: PROVIDERS_ENABLED
      - key: STRAVA_CLIENT_ID
        fromService:
          type: web
          name: pacepilot
          envVarKey: STRAVA_CLIENT_ID
      - key: STRAVA_CLIENT_SECRET
        fromService:
          type: web
          name: pacepilot
          envVarKey: STRAVA_CLIENT_SECRET

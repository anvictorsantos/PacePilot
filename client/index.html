<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>PacePilot</title>
    <meta
      name="description"
      content="Sincroniza o Strava. Plano de 7 dias a partir de objetivos + dias preferidos. Adapta-se a RPE, falhas e desvios nas longas."
    />
    <meta
      property="og:title"
      content="PacePilot — Treinador de Corrida Adaptativo"
    />
    <meta
      property="og:description"
      content="Cada corrida. Uma razão. Um pouco mais perto."
    />
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:image"
      content="/icon-512.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />
    <meta
      name="theme-color"
      content="#0B0B0F"
    />
    <!-- iOS ignores manifest: touch icon + standalone meta carry home-screen -->
    <link
      rel="apple-touch-icon"
      href="/icon-180.png"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="PacePilot"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
